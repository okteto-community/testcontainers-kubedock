build:
  app:
    context: .

deploy:
  - envsubst < k8s.yml | kubectl apply -f -

test:
  unit:
    image: maven:3.9-eclipse-temurin-21
    caches:
      - /root/.m2
      - /root/.kubedock
    commands:
      # Starts kubedock in the background with the Kubernetes credentials Okteto gives this
      # container. Testcontainers then runs its containers as pods in your namespace.
      - ./start-kubedock.sh
      - DOCKER_HOST=tcp://127.0.0.1:2475 TESTCONTAINERS_RYUK_DISABLED=true mvn -B test
    artifacts:
      - target/test-reports

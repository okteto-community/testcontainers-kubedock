build:
  app:
    context: .

deploy:
  - envsubst < k8s.yml | kubectl apply -f -

test:
  unit:
    image: maven:3.9-eclipse-temurin-21
    caches:
      - /root/.m2
      - /root/.kubedock
    commands:
      # Runs the tests with kubedock as their Docker API, with the Kubernetes credentials Okteto
      # gives this container. Testcontainers then runs its containers as pods in your namespace.
      - ./with-kubedock.sh mvn -B test
    artifacts:
      - target/test-reports
